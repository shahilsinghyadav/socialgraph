name: Diffblue Cover Baseline

on:
  push:
    branches:
      - main

jobs:
  diffblue:
    runs-on: ubuntu-latest # Must stay Linux for the Docker container action

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Diffblue Cover Pipeline
        uses: diffblue/cover-github-action@v2024.04.01
        with:
          license-key: ${{ secrets.DIFFBLUE_LICENSE_KEY }}
          access-token: ${{ secrets.DIFFBLUE_ACCESS_TOKEN }}
          # Forces baseline mode and overrides the missing PR variables
          args: --github-base-head="" --github-owner-repo-name="" --github-ref=""
