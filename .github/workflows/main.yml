name: Diffblue Cover Baseline

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diffblue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Diffblue Cover Pipeline
        uses: diffblue/cover-github-action@v2024.04.01
        with:
          license-key: ${{ secrets.DIFFBLUE_LICENSE_KEY }}
          access-token: ${{ secrets.DIFFBLUE_ACCESS_TOKEN }}
          # Leave args out or keep it default; the licensing error happens before code generation starts